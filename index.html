<!DOCTYPE html>
<html>
  <body>
<!---<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian Tech Group</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!----<style>
  :root {
    --teal: #00d4c8;
    --teal-dark: #00a89e;
    --teal-glow: rgba(0, 212, 200, 0.4);
    --black: #050a0f;
    --dark: #0a1520;
    --dark2: #0f1e2e;
    --cream: #f5f0e8;
    --white: #ffffff;
    --gold: #d4a853;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: var(--teal);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s, width 0.2s, height 0.2s, opacity 0.2s;
    mix-blend-mode: screen;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1.5px solid var(--teal);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.18s ease, width 0.3s, height 0.3s, opacity 0.3s;
    opacity: 0.5;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,200,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,200,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 60px;
    background: rgba(5,10,15,0.85);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(0,212,200,0.15);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }

  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px var(--teal-glow);
  }

  .logo-text {
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 1px;
    line-height: 1.2;
  }

  .logo-text span {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: var(--teal);
    letter-spacing: 3px;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    text-decoration: none;
    position: relative;
    transition: color 0.3s;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0; height: 1px;
    background: var(--teal);
    transition: width 0.3s;
  }

  .nav-links a:hover { color: var(--teal); }
  .nav-links a:hover::after { width: 100%; }

  .nav-cta {
    padding: 9px 24px;
    background: transparent;
    border: 1px solid var(--teal);
    color: var(--teal) !important;
    border-radius: 4px;
    transition: all 0.3s !important;
  }

  .nav-cta:hover {
    background: var(--teal) !important;
    color: var(--black) !important;
    box-shadow: 0 0 20px var(--teal-glow) !important;
  }

  .nav-cta::after { display: none !important; }

  /* HERO */
  #hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 120px 60px 80px;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,212,200,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(0,168,158,0.08) 0%, transparent 60%);
  }

  .hero-scanline {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,212,200,0.015) 3px,
      rgba(0,212,200,0.015) 4px
    );
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 18px;
    border: 1px solid rgba(0,212,200,0.4);
    border-radius: 100px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 2px;
    color: var(--teal);
    margin-bottom: 32px;
    animation: fadeSlideDown 0.8s ease both;
  }

  .hero-badge::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--teal);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--teal);
    animation: pulse 2s infinite;
  }

  .hero-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(42px, 8vw, 88px);
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -1px;
    margin-bottom: 24px;
    animation: fadeSlideDown 0.9s 0.1s ease both;
  }

  .hero-title .line1 { display: block; color: var(--white); }
  .hero-title .line2 {
    display: block;
    background: linear-gradient(90deg, var(--teal), #00fff7, var(--teal-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(0,212,200,0.6));
  }

  .hero-sub {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.55);
    max-width: 560px;
    margin: 0 auto 48px;
    line-height: 1.7;
    animation: fadeSlideDown 1s 0.2s ease both;
  }

  .hero-btns {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeSlideDown 1.1s 0.3s ease both;
  }

  .btn-primary {
    padding: 14px 38px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    color: var(--black);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    border-radius: 4px;
    text-decoration: none;
    cursor: none;
    box-shadow: 0 0 30px var(--teal-glow);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.5s;
  }

  .btn-primary:hover::before { left: 100%; }
  .btn-primary:hover { box-shadow: 0 0 50px var(--teal-glow), 0 8px 30px rgba(0,0,0,0.4); transform: translateY(-2px); }

  .btn-secondary {
    padding: 14px 38px;
    background: transparent;
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    text-decoration: none;
    cursor: none;
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--teal);
    color: var(--teal);
    background: rgba(0,212,200,0.06);
  }

  /* Floating camera SVG */
  .hero-graphic {
    position: absolute;
    right: 8%;
    top: 50%;
    transform: translateY(-50%);
    width: 320px;
    height: 320px;
    opacity: 0.12;
    animation: float 6s ease-in-out infinite;
    z-index: 1;
  }

  /* Stats strip */
  .stats-strip {
    position: relative;
    z-index: 2;
    background: rgba(15,30,46,0.8);
    border-top: 1px solid rgba(0,212,200,0.15);
    border-bottom: 1px solid rgba(0,212,200,0.15);
    padding: 28px 60px;
    display: flex;
    justify-content: center;
    gap: 80px;
    flex-wrap: wrap;
  }

  .stat-item {
    text-align: center;
    animation: fadeSlideUp 0.8s ease both;
  }

  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 32px;
    font-weight: 900;
    color: var(--teal);
    display: block;
    line-height: 1;
    filter: drop-shadow(0 0 10px rgba(0,212,200,0.5));
  }

  .stat-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  /* SERVICES */
  #services {
    padding: 120px 60px;
    position: relative;
    z-index: 1;
  }

  .section-header {
    text-align: center;
    margin-bottom: 70px;
  }

  .section-tag {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--teal);
    text-transform: uppercase;
    display: block;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 700;
    color: var(--white);
    line-height: 1.1;
  }

  .section-title em {
    font-style: normal;
    color: var(--teal);
  }

  .section-line {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, var(--teal), transparent);
    margin: 20px auto 0;
  }

  .services-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .service-column {
    background: rgba(15,30,46,0.6);
    border: 1px solid rgba(0,212,200,0.12);
    border-radius: 16px;
    padding: 44px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
  }

  .service-column::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .service-column:hover {
    border-color: rgba(0,212,200,0.3);
    transform: translateY(-6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(0,212,200,0.08);
  }

  .service-column:hover::before { opacity: 1; }

  .service-col-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, rgba(0,212,200,0.15), rgba(0,212,200,0.05));
    border: 1px solid rgba(0,212,200,0.25);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 24px;
    transition: box-shadow 0.3s;
  }

  .service-column:hover .service-col-icon {
    box-shadow: 0 0 30px rgba(0,212,200,0.3);
  }

  .service-col-title {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 8px;
  }

  .service-col-sub {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 24px;
    font-family: 'Space Mono', monospace;
  }

  .service-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .service-items li {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.5px;
    padding: 12px 16px;
    background: rgba(0,212,200,0.04);
    border-radius: 8px;
    border: 1px solid rgba(0,212,200,0.07);
    transition: all 0.25s;
  }

  .service-items li:hover {
    background: rgba(0,212,200,0.1);
    border-color: rgba(0,212,200,0.2);
    color: var(--white);
    transform: translateX(4px);
  }

  .service-items li::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--teal);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--teal);
    flex-shrink: 0;
  }

  /* WHY US */
  #why {
    padding: 100px 60px;
    background: linear-gradient(180deg, transparent, rgba(0,212,200,0.04), transparent);
    position: relative;
    z-index: 1;
  }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .feature-card {
    padding: 36px 28px;
    border: 1px solid rgba(0,212,200,0.1);
    border-radius: 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    background: rgba(10,21,32,0.5);
  }

  .feature-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .feature-card:hover {
    border-color: rgba(0,212,200,0.25);
    background: rgba(0,212,200,0.05);
    transform: translateY(-4px);
  }

  .feature-card:hover::after { opacity: 1; }

  .feature-icon {
    font-size: 40px;
    margin-bottom: 16px;
    display: block;
    filter: drop-shadow(0 0 12px rgba(0,212,200,0.4));
  }

  .feature-title {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .feature-text {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    line-height: 1.7;
    font-weight: 300;
  }

  /* CONTACT */
  #contact {
    padding: 120px 60px;
    position: relative;
    z-index: 1;
  }

  .contact-wrapper {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
  }

  .contact-info h3 {
    font-family: 'Orbitron', monospace;
    font-size: 26px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 16px;
  }

  .contact-info p {
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    line-height: 1.7;
    margin-bottom: 36px;
  }

  .contact-phones {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .phone-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: rgba(0,212,200,0.06);
    border: 1px solid rgba(0,212,200,0.15);
    border-radius: 10px;
    transition: all 0.3s;
    text-decoration: none;
    color: inherit;
  }

  .phone-item:hover {
    background: rgba(0,212,200,0.12);
    border-color: rgba(0,212,200,0.3);
    transform: translateX(4px);
    box-shadow: 0 0 20px rgba(0,212,200,0.15);
  }

  .phone-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .phone-number {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 1px;
  }

  .phone-label {
    font-size: 11px;
    color: var(--teal);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
  }

  /* Contact form */
  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 14px 18px;
    background: rgba(15,30,46,0.8);
    border: 1px solid rgba(0,212,200,0.15);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    resize: none;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: rgba(0,212,200,0.4);
    box-shadow: 0 0 20px rgba(0,212,200,0.1);
  }

  .form-group textarea { height: 110px; }

  .btn-submit {
    padding: 14px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    color: var(--black);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: none;
    box-shadow: 0 0 25px rgba(0,212,200,0.35);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .btn-submit:hover {
    box-shadow: 0 0 40px rgba(0,212,200,0.5);
    transform: translateY(-2px);
  }

  /* FOOTER */
  footer {
    position: relative;
    z-index: 1;
    background: rgba(5,10,15,0.95);
    border-top: 1px solid rgba(0,212,200,0.12);
    padding: 40px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  .footer-brand {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
  }

  .footer-brand span {
    color: var(--teal);
  }

  .footer-copy {
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
  }

  .footer-links {
    display: flex;
    gap: 24px;
  }

  .footer-links a {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.3s;
  }

  .footer-links a:hover { color: var(--teal); }

  /* Scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Animations */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(-50%) rotate(0deg); }
    50% { transform: translateY(calc(-50% - 18px)) rotate(3deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  @keyframes scanMove {
    from { transform: translateY(-100%); }
    to { transform: translateY(100vh); }
  }

  /* Scan line effect on hero */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,212,200,0.6), transparent);
    animation: scanMove 4s linear infinite;
    opacity: 0.3;
    pointer-events: none;
    z-index: 1;
  }

  /* Responsive */
  @media (max-width: 900px) {
    nav { padding: 16px 24px; }
    .nav-links { display: none; }
    #hero { padding: 120px 24px 60px; }
    .hero-graphic { display: none; }
    .services-grid { grid-template-columns: 1fr; }
    .features-grid { grid-template-columns: 1fr 1fr; }
    .contact-wrapper { grid-template-columns: 1fr; gap: 40px; }
    #services, #why, #contact { padding: 80px 24px; }
    .stats-strip { padding: 24px; gap: 32px; }
    footer { padding: 30px 24px; flex-direction: column; text-align: center; }
  }

  @media (max-width: 600px) {
    .features-grid { grid-template-columns: 1fr; }
  }

  /* Glow orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }

  .orb-1 {
    width: 400px; height: 400px;
    background: rgba(0,212,200,0.08);
    top: -100px; right: -100px;
  }

  .orb-2 {
    width: 300px; height: 300px;
    background: rgba(0,168,158,0.06);
    bottom: 100px; left: -50px;
  }
</style>
</head>
<body>

  // Custom cursor

    setTimeout(() => {
      ring.style.left = e.clientX + 'px';

    }, 80);
  });

  document.querySelectorAll('a, button, .service-column, .feature-card, .phone-item').forEach(el => {

      cursor.style.width = '20px';
      cursor.style.height = '20px';
      ring.style.width = '52px';
      ring.style.height = '52px';
      ring.style.opacity = '0.9';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.width = '12px';
      cursor.style.height = '12px';
      ring.style.width = '36px';
      ring.style.height = '36px';
      ring.style.opacity = '0.5';
    });
  });

  // Scroll reveal
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });

  reveals.forEach(el => observer.observe(el));

  // Form submit
  function handleSubmit(btn) {
    btn.textContent = 'Message Sent ✓';
    btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
    setTimeout(() => {
      btn.textContent = 'Send Message →';
      btn.style.background = '';
    }, 3000);
  }

  // Smooth nav scroll
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const target = document.querySelector(a.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth' });
      }
    });
  });

  // Nav shrink on scroll
  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    nav.style.padding = window.scrollY > 60 ? '12px 60px' : '18px 60px';
  });
</script>---->
